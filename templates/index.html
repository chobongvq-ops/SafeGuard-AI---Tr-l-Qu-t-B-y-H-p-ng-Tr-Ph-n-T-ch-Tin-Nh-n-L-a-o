<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeGuard AI - Quét bẫy hợp đồng và tin nhắn lừa đảo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-primary">SafeGuard AI</h1>
            <p class="text-muted">Hệ thống thông minh hỗ trợ sinh viên nhận diện và phòng tránh bẫy hợp đồng trọ, tin nhắn lừa đảo.</p>
        </div>

        <div class="card shadow-sm p-4 mb-4">
            <form action="/scan" method="POST">
                <div class="mb-3">
                    <label for="content" class="form-label fw-semibold">Nhập nội dung hợp đồng hoặc tin nhắn cần kiểm tra:</label>
                    <textarea class="form-control" id="content" name="content" rows="6" placeholder="Dán nội dung vào đây..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Phân tích rủi ro ngay</button>
            </form>
        </div>

        {% if result %}
        <div class="card shadow-sm p-4 border-start border-4 border-danger">
            <h3 class="h5 text-danger fw-bold">Kết quả phân tích:</h3>
            <p class="mb-1"><strong>Mức độ rủi ro:</strong> <span class="badge bg-danger">{{ risk }}</span></p>
            <p class="mb-0"><strong>Chi tiết:</strong> {{ result }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
